<div class="container main-container">
    <div class="row text-center">

        <div *ngFor="let produtos of produtosList" class="col-md-4" style="padding-bottom: 30px;">
            <div class="card h-100">
                <a class="text-decoration-none" [routerLink]="['/produto-detalhe', produtos.id]"> <!-- Implementar essa parte-->
                    <div style="align-content: center;">
                        <img src="/assets/{{ produtos.imagem }}" height="164px" width="253px" alt="">
                    </div>
                </a>
                <div class="card-body">
                    <h4 class="card-title">{{ produtos.nome | titlecase}}</h4> <!--usando o pipe titlecase-->
                    <p>Por apenas:</p>
                    <div><h4> {{ produtos.valor | currency:'BRL':symbol:'1.2-2':'pt'}}</h4></div> <!--usando o pipe de moeda-->
                </div>
                <div class="card-footer">
                    <a class="btn btn-primary" [routerLink]="['/carrinho', produtos.id]"> <!-- Implementar essa parte-->
                        <span class="fa fa-shopping-cart"></span> Comprar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
